# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# NOTE: This workflow only directly installs "hard" dependencies, i.e. Depends,
# Imports, and LinkingTo dependencies. Notably, Suggests dependencies are never
# installed, with the exception of testthat, knitr, and rmarkdown. The cache is
# never used to avoid accidentally restoring a cache containing a suggested
# dependency.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check-hard.yaml

permissions: read-all

jobs:
  check-no-suggests:
    runs-on: ${{ matrix.config.os }}
    # A hang here would otherwise run to GitHub's 6-hour default. One job
    # cap rather than R-CMD-check.yaml's two scopes: this leg installs no
    # Suggests and uses no cache, so there is no from-source dependency
    # build to protect from the cap, and the suite skips every daemon test
    # for want of mirai. The last green run (a pull_request run of the
    # M56 branch) took 12m09s end to end, 9m10s of it in the check step
    # (job 100897115868 of run 33832117316, 2026-09-04), so 30 is about
    # 2.5x that.
    timeout-minutes: 30

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # See R-CMD-check.yaml: test files run in parallel, one worker per
      # core, and this leg runs on ubuntu alone (4 vCPUs). Unset, testthat
      # would use 2.
      TESTTHAT_CPUS: 4

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          cache: false
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
