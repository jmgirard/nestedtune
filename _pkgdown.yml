url: https://jmgirard.github.io/nestedtune/

template:
  bootstrap: 5

articles:
- title: Guides
  navbar: ~
  contents:
  - nested-cv

reference:
- title: Nested resampling
  desc: >
    Build a nested resampling design whose size does not grow by a copy of the
    data for every outer fold.
  contents:
  - nested_resamples

- title: Running the loop
  desc: >
    Tune on each outer fold's inner resamples, select, then fit and score on
    the outer split — and keep what each fold chose.
  contents:
  - nested_tune_grid
  - collect_metrics.nested_results
  - print.nested_results

- title: The final model
  desc: >
    Run the same tuning procedure once more with the whole dataset in hand,
    and get back the model to deploy — as its own object, never a field on
    the results.
  contents:
  - nested_final_fit
  - print.nested_final_fit

- title: Re-exports
  contents:
  - reexports
