url: https://nestedtune.tidymodels.org

template:
  package: tidytemplate
  bootstrap: 5
  bslib:
    danger: "#CA225E"
    primary: "#CA225E"
  includes:
    in_header: |
      <script src="https://cdn.jsdelivr.net/gh/posit-dev/supported-by-posit/js/badge.min.js" data-max-height="43" data-hide-below="1200" data-light-bg="#666f76" data-light-fg="#f9f9f9"></script>
      <script defer data-domain="nestedtune.tidymodels.org,all.tidymodels.org" src="https://plausible.io/js/plausible.js"></script>


articles:
- title: Guides
  navbar: Guides
  contents:
  - nested-cv
  - estimate
  - tuners
  - results
- title: Articles
  navbar: Articles
  contents:
  - articles/parallel
  - articles/why-nest

reference:
- title: Nested resampling
  desc: >
    Build a nested resampling design whose size does not grow by a copy of the
    data for every outer fold.
  contents:
  - nested_resamples

- title: Running the loop
  desc: >
    Tune on each outer fold's inner resamples, select, then fit and score on
    the outer split — and keep what each fold chose.
  contents:
  - nested_tune_grid
  - nested_tune_bayes
  - nested_tune_race
  - nested_tune_sim_anneal
  - collect_metrics.nested_results
  - print.nested_results
  - summary.nested_results
  - autoplot.nested_results
  - agreement

- title: The final model
  desc: >
    Run the same tuning procedure once more with the whole dataset in hand,
    and get back the model to deploy — as its own object, never a field on
    the results.
  contents:
  - nested_final_fit
  - print.nested_final_fit
  - summary.nested_final_fit
  - predict.nested_final_fit
  - extract_tune_results
  - extract_scored_candidates

- title: Re-exports
  contents:
  - reexports
